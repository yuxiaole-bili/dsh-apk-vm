name: Publish to npm

# Manual publish only: set the NPM_TOKEN repository secret to an npm automation token
# that can publish dsh-apk-vm, then run this workflow from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate package
        run: |
          set -euo pipefail
          node --check index.js
          node --check client.js
          for f in lib/*.js; do node --check "$f"; done
          node scripts/privacy-scan.mjs
          npm publish --dry-run --access public

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
