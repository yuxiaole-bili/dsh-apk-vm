# Bundle patch: the Host half (index.js) mounts the local Android VM bridge and
# its same-origin HTTP routes; the `dsh.client` manifest entry in package.json
# loads ./client.js as the Web UI half that renders the sidebar panel.
- insert:
    - id: dsh-apk-vm
      name: 'dsh-apk-vm'
      config:
        # Open-source AOSP Android Emulator. Paths are auto-detected from
        # ANDROID_HOME / ANDROID_SDK_ROOT / common locations; set sdkRoot or
        # emulatorPath explicitly only for non-standard installs.
        # sdkRoot: 'D:/Android/sdk'
        # emulatorPath: 'D:/Android/sdk/emulator/emulator.exe'
        systemImage: 'system-images;android-34;default;x86_64'
        avdName: dsh_apk
        bootTimeoutMs: 1200000
        gpuMode: host
        accel: auto
        requireAccel: true
        quickBoot: true
        snapshotName: default_boot
        saveSnapshotAfterBoot: true
        # PNG fallback target frame rate (1-10); the H.264 stream below is 60.
        frameFps: 2
        # Warm start after plugin activation (opt-in; consumes CPU while the
        # plugin is loaded). Auto-start on the first panel open is on by default.
        prewarm: false
        prewarmDelayMs: 3000
        autoStart: true
        # Remember APKs installed through the plugin and reinstall them on the
        # next boot when the guest no longer has the package (quick-boot
        # snapshot reset, recreated AVD, plugin/emulator upgrade). The registry
        # lives in <profile>/.apk-vm/installed-apps.json; uploaded APKs are kept
        # under <profile>/.apk-vm/apks (newest 10). Set false to opt out.
        autoReinstall: true
        # Multiple isolated VMs: the first Agent gets the default instance;
        # later Agents get their own AVD/port until maxInstances extra VMs.
        multiInstance: true
        maxInstances: 3
        # Extra instances idle for this long (ms) with no panel frame / stream
        # client / Agent command are stopped automatically; the AVD is kept for
        # quick reuse. start()/the next Agent action boots it again.
        instanceIdleMs: 900000
        instanceReapIntervalMs: 60000
        # H.264 stream: up to 60 fps via the vendored scrcpy server; 960 keeps
        # 540x960 video (plenty for the panel) so software WebCodecs decode can
        # sustain ~60 fps.
        scrcpy: true
        scrcpyMaxSize: 960
        scrcpyMaxFps: 60
        scrcpyBitrate: 6000000
        # Zero-config first run: on the first /apk-vm/state or /apk-vm/setup
        # request, provision whatever is missing in the background — JDK 17
        # (Temurin, SHA-256 verified), Android SDK command-line tools, SDK
        # packages, the system image (~1.7 GB) and the AVD — then the normal
        # autoStart boots the VM. A cold machine downloads roughly 2.5 GB in
        # total. Set false to keep setup fully manual (the Environment card
        # still offers the one-click chain and create-avd).
        autoSetup: true
        # Optional location of the plugin-managed JDK 17. A system JDK or
        # JAVA_HOME is still preferred when present.
        # jdkRoot: 'C:/tools/dsh-jdk'
        # Pin the managed Temurin major (default 17). The packaged known-good
        # table covers 17.0.21+9; other majors need the Adoptium API.
        # jdkVersion: 17
        # Mirror fallback for the Temurin JDK archive. Adoptium hosts it on
        # GitHub; when that is unreachable the built-in Tsinghua mirror is
        # tried automatically (still verified against Adoptium's SHA-256).
        # Accepts a base URL or a list of bases; '' disables the fallback.
        # jdkMirror: 'https://mirrors.tuna.tsinghua.edu.cn/Adoptium'
        # Where the Agent activity journal is stored. The default is
        # <profile>/.apk-vm/activity (JSONL + screenshot PNGs, ring-pruned).
        # activityDir: 'D:/vm-logs/apk-vm-activity'
        # Manual (user-triggered only) system-image download from the
        # Environment card; autoSetup does not need this flag.
        allowSetupDownloads: false
        # The VM routes accept root shell/debug actions, so they reject
        # non-loopback clients by default even if the DSH web UI is exposed to
        # the LAN. Set true only behind your own authenticated reverse proxy.
        allowRemote: false
        # Remote VM sessions over SSH (opt-in feature): each session forwards a
        # remote emulator's adb port to a loopback port, attaches it as an
        # external device and streams H.264 back through the same SSH tunnel.
        # remoteMaxSessions caps how many remote sessions stay open at once.
        remoteMaxSessions: 4
        # Virtual camera defaults (local VM and new remote sessions).
        # back/front: none | emulated | virtualscene | webcam0..N
        # posters: PNG/JPEG files drawn inside the virtualscene (name=path).
        # camera:
        #   back: emulated
        #   front: none
        #   posters:
        #     - name: poster1
        #       path: 'D:/media/poster.png'
        # Virtual microphone defaults: off | host | file. Linux/remote hosts
        # use a PulseAudio virtual source; Windows supports host passthrough
        # (or an OBS/VB-Audio virtual device) and cannot loop a file without a
        # system audio driver.
        # mic:
        #   mode: off
        #   backend: ''
        #   filePath: ''
        # APK discovery roots. The current workspace is always included; add
        # platform-specific directories here (omit for a portable default).
        # roots:
        #   - 'D:/projects'
